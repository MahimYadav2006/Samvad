services:
  # -- Node.js API + Socket.io server --
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: samvad-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    env_file:
      - ./Backend/config.env
    environment:
      - NODE_ENV=production
      - PORT=${BACKEND_PORT:-8000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
    networks:
      - samvad-network

  # -- Vite/React SPA served by Nginx --
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: samvad-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    env_file:
      - ./Frontend/.env
    environment:
      # Override VITE_BACKEND_URL at deploy time via host env or root .env
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8000}}
    depends_on:
      - backend
    networks:
      - samvad-network

networks:
  samvad-network:
    driver: bridge
