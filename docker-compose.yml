version: "3.9"

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: samvad-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/config.env
    restart: always
    working_dir: /app
    command: ["npm", "start"]
    networks:
      - samvad-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: samvad-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
    networks:
      - samvad-net
    environment:
      - VITE_BACKEND_URL=http://samvad-backend:8000
