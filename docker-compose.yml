version: "3.9"

services:
  # ── Node.js API + Socket.io server ──────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: samvad-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/config.env
    environment:
      - NODE_ENV=production
    networks:
      - samvad-network

  # ── Vite/React SPA served by Nginx ──────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Browser runs outside Docker,
        # so it must hit localhost (host machine)
        VITE_BACKEND_URL: http://localhost:8000
    container_name: samvad-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - samvad-network

networks:
  samvad-network:
    driver: bridge